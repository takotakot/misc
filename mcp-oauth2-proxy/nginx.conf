user nginx;
worker_processes auto;

# Njs モジュールのロード
load_module modules/ngx_http_js_module.so;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Njs スクリプトのインポートと変数のセット
    js_import /etc/nginx/headers.js;
    js_set $headers_json headers.headers_json;

    # すべてのリクエストヘッダーを含むカスタムログフォーマット（escape=json を指定して \x22 エスケープを防ぐ）
    log_format detailed_headers escape=json '$remote_addr - $remote_user [$time_local] '
                                            '"$request" $status $body_bytes_sent '
                                            '"$http_referer" "$http_user_agent" '
                                            'headers="$headers_json"';

    access_log /var/log/nginx/access.log detailed_headers;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        location / {
            # 全アクセスを oauth2-proxy へフォワード
            proxy_pass http://oauth2-proxy:4180;
            
            # プロキシヘッダーの設定
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # HTTP/1.1 の利用とコネクション維持 (SSEに必須)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # SSE 向けのレスポンスバッファリング無効化
            proxy_buffering off;
            proxy_cache off;
            
            # タイムアウトの延長 (デフォルト60秒でタイムアウトするのを防ぐ)
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            
            # バッファサイズの調整
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }
    }
}
